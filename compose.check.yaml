# 只供自动测试使用；不加载开发 .env，不挂载业务数据卷。
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: antang_check
      POSTGRES_PASSWORD: local-check-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antang_check -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
