name: Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: bash scripts/check mobile

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: antang_check
          POSTGRES_PASSWORD: local-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antang_check -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANTANG_CHECK_DATABASE_URL: postgresql+psycopg://antang_check:local-check-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.19
      - run: bash scripts/check api
