name: antang

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  hindsight-postgres:
    build:
      context: ./infra/hindsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HINDSIGHT_POSTGRES_DB:?HINDSIGHT_POSTGRES_DB is required}
      POSTGRES_USER: ${HINDSIGHT_POSTGRES_USER:?HINDSIGHT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${HINDSIGHT_POSTGRES_PASSWORD:?HINDSIGHT_POSTGRES_PASSWORD is required}
    volumes:
      - hindsight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  hindsight:
    image: ghcr.io/vectorize-io/hindsight-api:0.8.4@sha256:c4471d10ab96db4ba91b0d26fa1801d57f541fae08de5634a5e186478a2cfa86
    restart: unless-stopped
    env_file:
      - ./api/.env
    command:
      - sh
      - -c
      - >-
        export HINDSIGHT_API_LLM_API_KEY="$${HACHIMI_API_KEY}";
        export HINDSIGHT_API_LLM_MODEL="$${HACHIMI_MODEL_NAME}";
        export HINDSIGHT_API_LLM_BASE_URL="$${HACHIMI_BASE_URL}";
        exec /app/start-all.sh
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${HINDSIGHT_POSTGRES_USER:?HINDSIGHT_POSTGRES_USER is required}:${HINDSIGHT_POSTGRES_PASSWORD:?HINDSIGHT_POSTGRES_PASSWORD is required}@hindsight-postgres:5432/${HINDSIGHT_POSTGRES_DB:?HINDSIGHT_POSTGRES_DB is required}
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pgroonga
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: Simplified Chinese
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-m3
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_MCP_ENABLED: "false"
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "false"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_ENABLE_OBSERVATIONS: "true"
      HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION: "true"
      HINDSIGHT_API_WORKER_ENABLED: "true"
      HINDSIGHT_API_WORKER_ID: antang-hindsight
      HINDSIGHT_API_WORKERS: "1"
      HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP: "true"
      HINDSIGHT_API_MODEL_INIT_TIMEOUT: "900"
      HINDSIGHT_API_STARTUP_WAIT_SECONDS: "900"
      HINDSIGHT_API_RECALL_MAX_QUERY_TOKENS: "8192"
      HINDSIGHT_API_ACCESS_LOG: "false"
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_RETAIN_MISSION: >-
        只保留用户明确表达或确认的经历、偏好、低血糖恐惧触发因素，以及用户明确反馈有效或无效的陪伴方式。助手的话只用于理解上下文，不得当作用户事实；忽略寒暄和未被用户确认的推测。
      HF_HOME: /home/hindsight/.cache/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
    volumes:
      - hindsight_model_cache:/home/hindsight/.cache/huggingface
    depends_on:
      hindsight-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    stop_grace_period: 30s

  api:
    image: antang-api:local
    restart: unless-stopped
    build:
      context: ./api
    env_file:
      - ./api/.env
    environment:
      # Compose 网络内通过服务名访问 PostgreSQL；该值覆盖 api/.env 的本机地址。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HINDSIGHT_MODE: ${HINDSIGHT_MODE:-online}
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  proactive-care-worker:
    image: antang-api:local
    command:
      - /app/.venv/bin/python
      - -m
      - antang_api.proactive_care.main
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      HINDSIGHT_MODE: ${HINDSIGHT_MODE:-online}
      HINDSIGHT_BASE_URL: http://hindsight:8888
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
    depends_on:
      api:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  hindsight_postgres_data:
  hindsight_model_cache:
