version: '1.0'
name: antang-check
displayName: 安糖代码检查
triggers:
  trigger: auto
  push:
    branches:
      include:
        - '.*'
  pr:
    branches:
      precise:
        - main
stages:
  - name: check
    displayName: 检查代码与数据库迁移
    trigger: auto
    strategy: naturally
    executor:
      - gitee
    steps:
      - step: custom-build@custom
        name: mobile-check
        displayName: 手机端检查与打包
        commands: |
          set -eo pipefail
          source setup node 24.13.0
          bash scripts/check mobile
      - step: custom-build@custom
        name: api-check
        displayName: 后端检查与隔离数据库测试
        commands: |
          set -eo pipefail
          source setup python 3.12
          source setup node 24.13.0
          unset PYTHONPATH
          python -m pip install --prefix /tmp/antang-ci-tools --index-url https://mirrors.aliyun.com/pypi/simple/ uv==0.11.19
          export PATH="/tmp/antang-ci-tools/bin:$PATH"
          CI=1 bash scripts/check-api-gitee
strategy:
  retry: '0'
  timeout: 30
  cloneDepth: 1
