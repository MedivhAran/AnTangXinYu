# 🌐 网络配置
networks:
  agentchat-network:
    driver: bridge

services:
  # MySQL数据库服务
  mysql:
    container_name: agentchat-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: agentchat
      MYSQL_USER: agentchat_user
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - agentchat-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # Redis缓存服务
  redis:
    image: redis:7.0-alpine
    container_name: agentchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks:
      - agentchat-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch 关键词检索服务（带 IK 中文分词插件）
  elasticsearch:
    build:
      context: ..
      dockerfile: docker/Dockerfile.elasticsearch
      args:
        ES_VERSION: "8.19.0"   # 与后端 elasticsearch 客户端(8.19.0)对齐
    container_name: agentchat-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false          # 关闭认证：仅 compose 内网可达，切勿对外映射 9200
      - node.store.allow_mmap=false           # 绕开宿主机 vm.max_map_count 内核要求，省去 sysctl 调整
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"      # JVM 堆，按服务器内存调整
      - TZ=Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - agentchat-network
    expose:
      - "9200"                                 # 只在内部网络暴露，不映射到宿主机
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  # 后端API服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agentchat-backend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ../data/antang_knowledge_pdfs:/app/data/antang_knowledge_pdfs:ro
      - ../data/vector_db:/app/vector_db
      - ../data/memory_db:/app/memory_db

    #    volumes:
    #      - ../src/backend:/app:cached
    #      - ../data:/app/data
    #      - ../logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - agentchat-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7860/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # 前端开发服务
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: agentchat-frontend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://agentchat-backend:7860
      TZ: Asia/Shanghai
    #    volumes:
    #      - ../src/frontend:/app:cached
    #      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agentchat-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8090" ]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    container_name: agentchat-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data/minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: on-failure
    networks:
      - agentchat-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

# 数据卷配置
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
